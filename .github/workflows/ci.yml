name: CI
on:
  push:
    paths-ignore: &docs_only
      - '**/*.md'
      - '**/*.svg'
      - '**/*.png'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/workflows/release.yml'
  pull_request:
    paths-ignore: *docs_only
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.event.head_commit.message, '#yolo') }}
env:
  # Every test by name with its outcome, and why each skipped one was skipped.
  PYTEST_ADDOPTS: -v -rs

jobs:
  tests:
    name: tests
    # Skipped by `#yolo` in the head commit message, and for a same-repo PR, which its head commit's push run covers.
    if: &run_ci >-
      !contains(github.event.head_commit.message, '#yolo') &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: [self-hosted, ci-runner]
    container: &mega_toolchain_container
      image: containers.zubax.com/zubax-fpga-toolchain-mega:latest
      options: --user root --cap-add NET_ADMIN --shm-size 8g --volume /run/udev:/run/udev:ro
    steps:
      - &checkout_step
        uses: actions/checkout@v7
      - &python_cache_step
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-
      - run: nox -s tests mypy black

  deep:
    name: deep
    if: &run_deep contains(github.event.head_commit.message, '#ci-deep')
    runs-on: [self-hosted, ci-runner]
    container: *mega_toolchain_container
    steps:
      - *checkout_step
      - *python_cache_step
      - run: nox -s deep

  accuracy:
    name: accuracy
    if: *run_deep
    runs-on: [self-hosted, ci-runner-small]
    container: *mega_toolchain_container
    steps:
      - *checkout_step
      - *python_cache_step
      - run: nox -s accuracy

  synth:
    name: synth
    if: *run_ci
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zubax/zubax-fpga-toolchain:latest
      options: --user root
    steps:
      - *checkout_step
      - *python_cache_step
      - run: nox -s synth
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: synth-artifacts, path: build, if-no-files-found: ignore }

  synth_vivado:
    name: synth_vivado
    if: *run_ci
    runs-on: [self-hosted, ci-runner]
    container: *mega_toolchain_container
    steps:
      - *checkout_step
      - *python_cache_step
      # Vivado installs its Tcl store in the home at its first start and the store's apps at its first `read_verilog`,
      # which the parallel runs would otherwise race over.
      - run: |
          echo 'module warm; endmodule' > /tmp/warm.v
          echo 'read_verilog /tmp/warm.v' > /tmp/warm.tcl
          vivado -mode batch -nojournal -nolog -source /tmp/warm.tcl
      - run: nox -s synth_vivado
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: synth_vivado-artifacts, path: build, if-no-files-found: ignore }

  synth_diamond:
    name: synth_diamond
    if: *run_ci
    runs-on: [self-hosted, ci-runner]
    container: *mega_toolchain_container
    steps:
      - *checkout_step
      - *python_cache_step
      - run: nox -s synth_diamond
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: synth_diamond-artifacts, path: build, if-no-files-found: ignore }

  synth_quartus:
    name: synth_quartus
    # After Diamond, so that the three runners take the tests, Vivado and Diamond, and Vivado, the longest, never queues.
    needs: synth_diamond
    if: ${{ !cancelled() && needs.synth_diamond.result != 'skipped' }}
    runs-on: [self-hosted, ci-runner]
    container: *mega_toolchain_container
    steps:
      - *checkout_step
      - *python_cache_step
      - run: nox -s synth_quartus
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: synth_quartus-artifacts, path: build, if-no-files-found: ignore }
