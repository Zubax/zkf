[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zkf"
dynamic = ["version"]
requires-python = ">=3.14"
description = "Efficient floating-point engine RTL for controls & embedded following IEEE 754 sans NaN and subnormals"
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Zubax Robotics", email = "pavel.kirienko@zubax.com" }]
keywords = ["fpga", "hdl", "verilog", "floating point", "rtl", "dsp", "hardware design"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Typing :: Typed",
]
dependencies = [
    "amaranth[builtin-yosys]~=0.5",
    "mpmath~=1.4",
]

[project.optional-dependencies]
test = [
    "numpy~=2.4",
    "pytest~=9.0",
    "pytest-xdist~=3.2",
    "pytest-cov~=7.0",
    "mypy~=2.4",
]

[project.urls]
Repository = "https://github.com/Zubax/zkf"

[tool.setuptools.dynamic]
version = { attr = "zkf.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["zkf"]

[tool.setuptools.package-data]
zkf = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not deep and not accuracy and not synth", "-p", "no:cacheprovider"]
markers = [
    "deep: the long tier",
    "accuracy: end-to-end accuracy against mpmath",
    "synth: the specs of the catalog through the synthesis flows",
]
# Amaranth reports several mistakes only as warnings; a component that a test builds and drops is not one.
filterwarnings = ["error", "ignore::amaranth.hdl.UnusedElaboratable"]

[tool.black]
line-length = 120
target-version = ["py314"]

# Of the package: the structural variants of the hardware that the configurations build, and the reference.
[tool.coverage.run]
branch = true
source = ["zkf"]
omit = ["zkf/__main__.py"]

[tool.coverage.report]
fail_under = 99

[tool.mypy]
strict = true
files = ["zkf", "tests"]
follow_imports = "silent"
disallow_subclassing_any = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["amaranth.*", "mpmath.*"]
ignore_missing_imports = true
follow_untyped_imports = false
